[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aki-api"
version = "0.1.0"
description = "Aki control plane API"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's `Depends(...)` / `Query(...)` / `Body(...)` in argument
# defaults is the idiomatic pattern; the rule otherwise generates noise across
# every route handler.
"services/api/app/routes/*.py" = ["B008"]
"services/api/app/main.py" = ["B008"]
"services/api/app/middleware.py" = ["B008"]
"services/api/tests/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
# warn_return_any is off because SQLAlchemy's `.scalar_one_or_none()`,
# Redis client methods, and httpx `.json()` all return `Any` — we can't
# narrow those without per-call casts, and the noise drowns out real
# bugs. We rely on structural typing + tests for those return paths.
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"
