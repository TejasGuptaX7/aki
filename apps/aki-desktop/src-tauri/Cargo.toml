[package]
name = "aki-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aki-desktop"
path = "src/main.rs"

# Companion MCP server: exposes calendar/mail/notes/shell on macOS via
# osascript. Hermes (running locally) speaks to it over stdio.
[[bin]]
name = "aki-mcp-mac"
path = "src/bin/aki_mcp_mac.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-positioner = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ed25519-dalek = { version = "2", features = ["pem"] }
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# OS keychain (macOS Keychain, Win Credential Manager, GNOME secret-service).
keyring = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
