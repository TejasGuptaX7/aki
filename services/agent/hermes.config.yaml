# Hermes per-org config template (Hermes 0.13.0 schema, verified live).
# The control plane materializes one of these per organization into
# ${HERMES_DATA_DIR}/<org_id>/config.yaml before booting the process.
#
# Required runtime env vars (passed to `docker run`):
#   HERMES_HOME           = /opt/data            (hermes lives here)
#   API_SERVER_HOST       = 0.0.0.0              (expose OpenAI-compat API)
#   API_SERVER_PORT       = 8080
#   API_SERVER_KEY        = <per-org secret>     (bearer token for the proxy)
#   OPENAI_API_KEY        = <upstream key>       (referenced by model.api_key_env)
#
# Required pip extras baked into the image (see Dockerfile):
#   mcp>=1.6.0       (streamable HTTP MCP transport for Composio)
#   aiohttp>=3.9     (powers the OpenAI-compat API server)
#
# Cost note: a single turn with this config spent ~34k prompt tokens —
# Hermes injects skills + MCP tool definitions per request. Plan caching
# in v0.4.0+ helps across turns within a session.

model:
  provider: custom                    # Hermes has no first-class 'openai';
  default: ${HERMES_MODEL_NAME}       # custom + base_url points at OpenAI directly.
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY

# mcp_servers entries appended at boot from the org's `connections` rows.
# Default empty so the template is valid pre-connect; control plane writes
# the full dict before launch.
mcp_servers: {}
