name: Deploy

on:
  push:
    branches: [main]

# Ensure only one deploy runs at a time per environment.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ── Build & push container image to GHCR ──
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── Deploy trigger ──
  # Uncomment and configure when you have a Railway (or Fly.io) project ready.
  # Railway supports webhook deploys; Fly.io has `fly deploy --image`.
  #
  # deploy:
  #   needs: build-push
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Trigger Railway deploy
  #       run: |
  #         curl -fsS -X POST \
  #           -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
  #           -H "Content-Type: application/json" \
  #           -d '{"projectId":"${{ secrets.RAILWAY_PROJECT_ID }}","serviceId":"${{ secrets.RAILWAY_SERVICE_ID }}"}' \
  #           https://backboard.railway.app/graphql/v2
  #
  #     # Or for Fly.io:
  #     # - name: Deploy to Fly.io
  #     #   uses: superfly/flyctl-actions/setup-flyctl@master
  #     # - run: flyctl deploy --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --app your-app-name
  #     #   env:
  #     #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
