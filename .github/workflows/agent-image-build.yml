name: agent-image-build

on:
  push:
    branches: [main]
    paths:
      - "services/agent/**"
      - ".github/workflows/agent-image-build.yml"
  workflow_dispatch:

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/aki-hermes

jobs:
  build-push:
    name: build & push hermes image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha_tag=${REGISTRY}/${IMAGE_NAME}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: services/agent
          file: services/agent/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No deploy step: the control plane (services/api) spawns per-org
      # Machines from this image via the Fly Machines API. See
      # infra/fly/agent.md for the rationale.
      - name: Summary
        run: |
          {
            echo "### Hermes image published"
            echo ""
            echo "- \`${{ steps.meta.outputs.sha_tag }}\`"
            echo "- \`${{ steps.meta.outputs.latest_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
